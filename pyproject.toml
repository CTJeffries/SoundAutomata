[project]
name = "sound-automata"
version = "1.0.0"
description = "Musical Cellular Automata Generator - Academic research project using cellular automata to generate music"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "pygame-ce>=2.5.0",  # Using pygame-ce, the maintained fork of pygame with Python 3 support
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
